services:
  - type: web
    name: sbom-risk-scorer
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn dashboard.app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SBOM_DATA_DIR
        value: "" # Optional: specify if overriding default sample_data
      - key: LLM_PROVIDER
        value: "ollama" # e.g. 'ollama' or 'gemini'
      - key: OLLAMA_BASE_URL
        value: "" # e.g. 'http://localhost:11434'
      - key: OLLAMA_MODEL
        value: "llama3.2" # e.g. 'llama3.2'
      - key: OLLAMA_API_KEY
        value: ""
      - key: GEMINI_API_KEY
        value: ""
      - key: GEMINI_MODEL
        value: "gemini-2.5-pro"
